[project]
name = "rustlife"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jamesmeadows7", email = "james.w.meadows@durham.ac.uk" }
]
requires-python = ">=3.14"
dependencies = []

[tool.maturin]
module-name = "rustlife._core"
python-packages = ["rustlife"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
